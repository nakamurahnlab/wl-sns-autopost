name: Threads auto post

# 時刻はUTC表記（JST−9時間）。GitHub側の混雑で数分〜数十分遅れることがある
on:
  schedule:
    - cron: "30 1 * * *"  # 10:30 JST 新着（休日・祝日の10:00公開分）
    - cron: "30 9 * * *"  # 18:30 JST 新着（平日の18:00公開分）
    - cron: "15 3 * * *"  # 12:15 JST 過去記事を1本
  workflow_dispatch:
    inputs:
      mode:
        description: "new=新着 / backfill=過去記事"
        type: choice
        options: [new, backfill]
        default: new
      dry_run:
        description: "投稿せず文面だけ確認する"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: threads-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Post to Threads
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          MODE=new
          if [ "$EVENT" = "workflow_dispatch" ]; then MODE="$INPUT_MODE"; fi
          if [ "$SCHEDULE" = "15 3 * * *" ]; then MODE=backfill; fi
          if [ "$DRY_RUN" = "true" ]; then
            python3 post_threads.py --mode "$MODE" --dry-run
          else
            python3 post_threads.py --mode "$MODE"
          fi

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in state.json token.enc; do if [ -f "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "chore: update post state"
            git pull --rebase
            git push
          fi

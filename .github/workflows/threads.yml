name: Threads auto post

# 1日3本（朝・昼・夜の枠で1本ずつ）。GitHub の schedule は数時間遅れることがあるので、
# 時刻指定はやめて毎時起動し、投稿するかどうかは post_threads.py の --mode auto が JST で判定する
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto=枠判定（定時と同じ） / new=新着 / backfill=過去記事"
        type: choice
        options: [auto, new, backfill]
        default: new
      dry_run:
        description: "投稿せず文面だけ確認する"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: threads-auto
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Post to Threads
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          MODE=auto
          if [ "$EVENT" = "workflow_dispatch" ]; then MODE="$INPUT_MODE"; fi
          if [ "$DRY_RUN" = "true" ]; then
            python3 post_threads.py --mode "$MODE" --dry-run
          else
            python3 post_threads.py --mode "$MODE"
          fi

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in state.json token.enc; do if [ -f "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "chore: update post state"
            git pull --rebase
            git push
          fi
